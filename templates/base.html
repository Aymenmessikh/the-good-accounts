<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Les bons comptes{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="/">Les bons comptes</a>

      <div class="d-flex align-items-center gap-3">
        {% if user.is_authenticated %}
          <span class="navbar-text">{{ user.get_full_name }}</span>
          <form method="post" action="{% url 'accounts:logout' %}" class="m-0">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-light btn-sm">Log out</button>
          </form>
        {% else %}
          <a class="btn btn-outline-light btn-sm" href="{% url 'accounts:login' %}">Log in</a>
          <a class="btn btn-primary btn-sm" href="{% url 'accounts:register' %}">Sign up</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container" style="max-width: 560px;">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
